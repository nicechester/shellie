name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release with installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # launchd/install.sh fetches this asset by name (setup.sh).
          cp launchd/setup.sh setup.sh
          gh release create "$GITHUB_REF_NAME" setup.sh \
            --title "Shellie $GITHUB_REF_NAME" \
            --generate-notes
